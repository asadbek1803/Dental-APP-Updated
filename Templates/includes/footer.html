<!-- JavaScript Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script>
    // Global Variables
    let currentPatient = null;
    
    // Initialize Application
    document.addEventListener('DOMContentLoaded', function() {
        updateCurrentDate();
        initializeComponents();
        setInterval(updateCurrentDate, 60000); // Update every minute
    });
    
    // Date and Time Functions
    function updateCurrentDate() {
        const now = new Date();
        const options = {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            timeZone: 'Asia/Tashkent'
        };
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
            dateElement.textContent = now.toLocaleDateString('uz-UZ', options);
        }
    }
    
    // Initialize Components
    function initializeComponents() {
        // Initialize tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
        
        // Initialize modals
        var modalTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="modal"]'));
        
        // Add form validation
        addFormValidation();
        
        // Add search functionality
        addSearchFunctionality();
    }
    
    // Form Validation
    function addFormValidation() {
        const forms = document.querySelectorAll('.needs-validation');
        forms.forEach(form => {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            });
        });
    }
    
    // Search Functionality
    function addSearchFunctionality() {
        const searchInputs = document.querySelectorAll('[data-search-target]');
        searchInputs.forEach(input => {
            input.addEventListener('input', function() {
                const target = document.getElementById(this.dataset.searchTarget);
                const searchTerm = this.value.toLowerCase();
                const items = target.querySelectorAll('[data-search-item]');
                
                items.forEach(item => {
                    const text = item.textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    }
    
    // Utility Functions
    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('uz-UZ');
    }
    
    function formatDateTime(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString('uz-UZ');
    }
    
    function getGenderText(gender) {
        const genderMap = {
            'male': 'Erkak',
            'female': 'Ayol',
            'other': 'Boshqa'
        };
        return genderMap[gender] || gender;
    }
    
    function getAgeGroupText(ageGroup) {
        const ageGroupMap = {
            'child': 'Farzand',
            'youth': 'Yoshlik',
            'adult': 'Kattalar',
            'elderly': 'Qarilik'
        };
        return ageGroupMap[ageGroup] || ageGroup;
    }
    
    // Toast Notifications
    function showToast(message, type = 'success') {
        const toastContainer = document.getElementById('toast-container') || createToastContainer();
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-white bg-${type} border-0`;
        toast.setAttribute('role', 'alert');
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        
        toastContainer.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast);
        bsToast.show();
        
        // Remove toast after it's hidden
        toast.addEventListener('hidden.bs.toast', function() {
            toast.remove();
        });
    }
    
    function createToastContainer() {
        const container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container position-fixed top-0 end-0 p-3';
        container.style.zIndex = '9999';
        document.body.appendChild(container);
        return container;
    }
    
    // Confirmation Dialog
    function confirmAction(message, callback) {
        if (confirm(message)) {
            callback();
        }
    }
    
    // Loading Spinner
    function showLoading(element) {
        const originalContent = element.innerHTML;
        element.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Yuklanmoqda...';
        element.disabled = true;
        
        return function hideLoading() {
            element.innerHTML = originalContent;
            element.disabled = false;
        };
    }
    
    // Form Helpers
    function clearForm(formId) {
        const form = document.getElementById(formId);
        if (form) {
            form.reset();
            form.classList.remove('was-validated');
        }
    }
    
    function populateForm(formId, data) {
        const form = document.getElementById(formId);
        if (form) {
            Object.keys(data).forEach(key => {
                const field = form.querySelector(`[name="${key}"]`);
                if (field) {
                    if (field.type === 'checkbox') {
                        field.checked = data[key];
                    } else if (field.type === 'radio') {
                        const radio = form.querySelector(`[name="${key}"][value="${data[key]}"]`);
                        if (radio) radio.checked = true;
                    } else {
                        field.value = data[key];
                    }
                }
            });
        }
    }
    
    // CSRF Token Helper for Django
    function getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value;
    }
    
    // Ajax Helper
    function makeAjaxRequest(url, options = {}) {
        const defaultOptions = {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCSRFToken()
            }
        };
        
        const finalOptions = Object.assign(defaultOptions, options);
        
        return fetch(url, finalOptions)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .catch(error => {
                console.error('Ajax request failed:', error);
                showToast('Xatolik yuz berdi: ' + error.message, 'danger');
                throw error;
            });
    }
    
    // Page-specific initialization
    function initDashboard() {
        // Dashboard specific code
        console.log('Dashboard initialized');
    }
    
    function initPatients() {
        // Patients page specific code
        console.log('Patients page initialized');
    }
    
    function initMedicalAssessment() {
        // Medical assessment specific code
        console.log('Medical assessment initialized');
    }
    
    // Auto-save functionality
    function enableAutoSave(formId, saveUrl) {
        const form = document.getElementById(formId);
        if (form) {
            const inputs = form.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                input.addEventListener('change', function() {
                    const formData = new FormData(form);
                    makeAjaxRequest(saveUrl, {
                        method: 'POST',
                        body: formData
                    }).then(response => {
                        if (response.success) {
                            showToast('Ma\'lumotlar saqlandi', 'success');
                        }
                    });
                });
            });
        }
    }
</script>

<!-- Messages Framework Integration -->
{% if messages %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% for message in messages %}
            showToast('{{ message|escapejs }}', '{{ message.tags }}');
        {% endfor %}
    });
</script>
{% endif %}
