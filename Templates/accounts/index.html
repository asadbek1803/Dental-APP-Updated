{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'accounts/fonts/icomoon/style.css' %}">

    <link rel="stylesheet" href="{% static 'accounts/css/owl.carousel.min.css' %}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'accounts/css/bootstrap.min.css' %}">
    <!-- AlertifyJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/css/themes/default.min.css"/>

    

    <!-- Style -->
    <link rel="stylesheet" href="{% static 'accounts/css/style.css' %}">
    <style>
      <style>
  body {
    font-family: 'Roboto', sans-serif;
    background-color: #f8f9fa;
  }

  .form-control {
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 16px;
    border: 1px solid #ced4da;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
  }

  .input-group-text {
    border-radius: 10px 0 0 10px;
    padding: 12px 15px;
  }

  .form-group label {
    font-weight: 500;
    margin-bottom: 5px;
  }

  .btn-primary {
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    background-color: #007bff;
    border: none;
    transition: background-color 0.3s;
  }

  .btn-primary:hover {
    background-color: #0056b3;
  }

  .forgot-pass {
    font-size: 14px;
    color: #6c757d;
  }

  .forgot-pass:hover {
    color: #007bff;
    text-decoration: underline;
  }

  .alertify-notifier .ajs-message {
    font-size: 18px;
    padding: 20px 25px;
    border-radius: 10px;
  }

  .control--checkbox .caption {
    font-size: 15px;
  }
</style>

    </style>
    <title>Dental CRM Kirish</title>
  </head>
  <body>
  

  <div class="d-lg-flex half">
    <div class="bg order-1 order-md-2" style="background-image: url({% static 'accounts/images/banner.png' %})"></div>

   
    <div class="contents order-2 order-md-1">

      <div class="container">
        <div class="row align-items-center justify-content-center">
          <div class="col-md-7">
            <h3>Kirish <strong>Dental CRM </strong></h3>
            <p class="mb-4">⚠️ Iltimos login ma'lumotlaringizni boshqa shaxslarga oshkor etmang! Aks holda ma'lumotlar xavf ostida bo'lishi mumkin.</p>
            <form action="{% url 'login' %}" method="post"> {% csrf_token %}
              <div class="form-group first">
                <label for="phone">Telefon raqam</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white">+998</span>
                    <input type="tel" 
                       required
                       class="form-control form-control-lg" 
                       id="phone" 
                       name="phone"
                       maxlength="13" 
                       placeholder="90 123 45 67"
                       onkeypress="return (event.charCode >= 48 && event.charCode <= 57)"
                       onpaste="return false">
                  </div>
                  <small class="form-text text-muted">Faqat raqamlar, misol: 901234567</small>
                  <script>
                    document.getElementById('phone').addEventListener('input', function(e) {
                    let value = this.value.replace(/[^0-9]/g, '');
                    if(value.length > 9) {
                      value = value.slice(0,9);
                    }
                    // Add spaces for better readability
                    if(value.length >= 2) {
                      value = value.slice(0,2) + ' ' + value.slice(2);
                    }
                    if(value.length >= 6) {
                      value = value.slice(0,6) + ' ' + value.slice(6);
                    }
                    if(value.length >= 9) {
                      value = value.slice(0,9) + ' ' + value.slice(9);
                    }
                    this.value = value.trim();
                    });
                  </script>
              </div>
              <div class="form-group last mb-3">
                <label for="password">Parol</label>
                <input required type="password" name="password" class="form-control" placeholder="Sizning parolingiz" id="password">
              </div>
              
              <div class="d-flex mb-5 align-items-center">
                <label class="control control--checkbox mb-0"><span class="caption">Menga bildirilsin</span>
                  <input type="checkbox" checked="checked"/>
                  <div class="control__indicator"></div>
                </label>
                <span class="ml-auto"><a href="#" class="forgot-pass">Parolni unutdim</a></span> 
              </div>
              <input type="submit" value="Kirish" class="btn btn-block btn-primary">

            </form>
           {% if error %}


            <style>
              /* Xabarni kattalashtirish uchun */
              .alertify-notifier .ajs-message {
                font-size: 18px; /* matnni kattalashtiradi */
                padding: 20px 25px;
              }
            </style>

            <script>
              document.addEventListener("DOMContentLoaded", function () {
                alertify.set('notifier', 'position', 'bottom-right');  // pastki o‘ng burchak
                alertify.set('notifier', 'delay', 8); // 8 soniya davom etadi
                alertify.error("{{ error|escapejs }}");
              });
            </script>
            {% endif %}

          </div>
        </div>
      </div>
    </div>

    
  </div>
    


    <!-- AlertifyJS JS -->
    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.13.1/build/alertify.min.js"></script>
    <script src="{% static 'accounts/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'accounts/js/popper.min.js' %}"></script>
    <script src="{% static 'accounts/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'accounts/js/main.js' %}"></script>
  </body>
</html>
